<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mouataz App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #ffffff;
      color: #000000;
      transition: background-color 0.3s, color 0.3s;
    }

    .dark-mode {
      background-color: #121212;
      color: #ffffff;
    }

    .container {
      max-width: 400px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }

    .toggle-switch {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 50px;
      height: 25px;
      background-color: #000;
      border-radius: 25px;
      cursor: pointer;
    }

    .toggle-switch::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 19px;
      height: 19px;
      background-color: #fff;
      border-radius: 50%;
      transition: transform 0.3s;
    }

    .dark-mode .toggle-switch::before {
      transform: translateX(25px);
      background-color: #fff;
    }

    .profile-img {
      width: 100px;
      height: 100px;
      margin: 20px auto 10px;
      border-radius: 50%;
      background: #d1d1d1;
      display: block;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin: 10px 0;
      border: 1px solid #999;
      border-radius: 5px;
      box-sizing: border-box;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .half-input {
      width: 50%;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      cursor: pointer;
    }

    .divider {
      margin: 20px 0;
      display: flex;
      align-items: center;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #000;
    }

    .divider span {
      margin: 0 10px;
    }

    .dark-mode .divider::before,
    .dark-mode .divider::after {
      background: #fff;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .social-icons img {
      width: 40px;
      height: 40px;
      cursor: pointer;
    }

    .bottom-text {
      margin-top: 10px;
    }

    .bottom-text a {
      color: green;
      text-decoration: none;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body id="body">
  <div class="toggle-switch" onclick="toggleDarkMode()"></div>

  <div class="container">
    <!-- Login Form -->
    <div id="loginForm">
      <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Profile" class="profile-img">
      <div class="title">Log in</div>
      <input type="email" placeholder="example@gmail.com">
      <div class="password-wrapper">
        <input type="password" id="loginPassword" placeholder="Password">
        <span class="toggle-password" onclick="togglePassword('loginPassword')">👁️</span>
      </div>
      <div class="divider"><span>or</span></div>
      <div class="social-icons">
        <img src="https://cdn-icons-png.flaticon.com/512/2702/2702602.png" alt="Google">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" alt="Facebook">
        <img src="https://cdn-icons-png.flaticon.com/512/561/561127.png" alt="Email">
      </div>
      <div class="bottom-text">
        Don't have an account? <a href="#" onclick="showSignup()">Sign up</a>
      </div>
    </div>

    <!-- Sign Up Form -->
    <div id="signupForm" class="hidden">
      <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Profile" class="profile-img">
      <div class="title">Sign up</div>
      <div class="row">
        <input type="text" class="half-input" placeholder="Nick name">
        <input type="text" class="half-input" placeholder="Family name">
      </div>
      <input type="email" placeholder="example@gmail.com">
      <div class="password-wrapper">
        <input type="password" id="signupPassword" placeholder="Password">
        <span class="toggle-password" onclick="togglePassword('signupPassword')">👁️</span>
      </div>
      <div class="divider"><span>or</span></div>
      <div class="social-icons">
        <img src="https://cdn-icons-png.flaticon.com/512/2702/2702602.png" alt="Google">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" alt="Facebook">
        <img src="https://cdn-icons-png.flaticon.com/512/561/561127.png" alt="Email">
      </div>
      <div class="bottom-text">
        Already have an account? <a href="#" onclick="showLogin()">Log in</a>
      </div>
    </div>
  </div>

  <script>
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function showSignup() {
      document.getElementById("loginForm").classList.add("hidden");
      document.getElementById("signupForm").classList.remove("hidden");
    }

    function showLogin() {
      document.getElementById("signupForm").classList.add("hidden");
      document.getElementById("loginForm").classList.remove("hidden");
    }
  </script>
</body>
</html>
